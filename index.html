
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>National Endometriosis Specialist Accessibility Map</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  .map-control {
    background: white;
    padding: 12px;
    border-radius: 5px;
    box-shadow: 0 1px 6px #888;
    font: 13px Arial, sans-serif;
  }

  .map-control label {
    display: block;
    margin: 7px 0;
    cursor: pointer;
  }

  .legend {
    background: white;
    padding: 10px;
    border-radius: 5px;
    font: 12px Arial, sans-serif;
    min-width: 180px;
    box-shadow: 0 1px 6px #888;
  }

  .legend-bar {
    height: 14px;
    margin: 8px 0 5px;
  }

  .legend-labels {
    display: flex;
    justify-content: space-between;
  }

  .status {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 1px 6px #888;
    font: 13px Arial, sans-serif;
  }
</style>
</head>

<body>

<div id="map"></div>

<div id="status" class="status">
  Loading national map...
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

<script>

////////////////////////////////////////////////////////////
// Initialize map
////////////////////////////////////////////////////////////

const map = L.map("map", {
  preferCanvas: true,
  zoomControl: true
}).setView([39.5, -98.5], 4);

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }
).addTo(map);

////////////////////////////////////////////////////////////
// Create dedicated provider pane
////////////////////////////////////////////////////////////

map.createPane("providerPane");

map.getPane("providerPane").style.zIndex = 650;

// SVG markers stay interactive above canvas polygons
const providerRenderer = L.svg({
  pane: "providerPane"
});

////////////////////////////////////////////////////////////
// Global variables
////////////////////////////////////////////////////////////

let currentLayer = "SPAR";
let tractLayer = null;
let providerLayer = L.layerGroup();
let showProviders = true;
let spaiMax = 1;

////////////////////////////////////////////////////////////
// Color functions
////////////////////////////////////////////////////////////

function numeric(value) {
  return Number(value);
}

function getColor(value, type) {

  if (
    value === null ||
    value === undefined ||
    !Number.isFinite(numeric(value))
  ) {
    return "transparent";
  }

  if (type === "SPAR") {

    const scaled =
      Math.max(0, Math.min(numeric(value), 5)) / 5;

    return d3.interpolateViridis(scaled);
  }

  const scaled =
    Math.max(0, Math.min(numeric(value) / spaiMax, 1));

  return d3.interpolateMagma(scaled);
}

////////////////////////////////////////////////////////////
// Tract styling
////////////////////////////////////////////////////////////

function tractStyle(feature) {

  const p = feature.properties;

  return {
    color: "#666666",
    weight: 0.1,
    opacity: 0.25,
    fillColor: getColor(
      p[currentLayer],
      currentLayer
    ),
    fillOpacity: 1.0
  };
}

////////////////////////////////////////////////////////////
// Popup formatting
////////////////////////////////////////////////////////////

function formatSPAI(value) {
  if (value == null) return "NA";
  return Number(value).toExponential(3);
}

function tractPopup(feature) {

  const p = feature.properties;

  return `
    <b>FIPS Code:</b> ${p.FIPS}<br>
    <b>SPAR:</b> ${Number(p.SPAR).toFixed(2)}<br>
    <b>SPAI:</b> ${formatSPAI(p.SPAI)}<br>
    <b>Females Ages 10–54:</b>
    ${Number(p.POPULATION).toLocaleString()}
  `;
}

////////////////////////////////////////////////////////////
// Layer controls
////////////////////////////////////////////////////////////

const layerControl = L.control({
  position: "topleft"
});

layerControl.onAdd = function() {

  const div = L.DomUtil.create(
    "div",
    "map-control"
  );

  div.innerHTML = `
    <b>Accessibility Measure</b>

    <label>
      <input type="radio"
             name="measure"
             value="SPAR"
             checked>
      SPAR
    </label>

    <label>
      <input type="radio"
             name="measure"
             value="SPAI">
      SPAI
    </label>

    <hr>

    <label>
      <input type="checkbox"
             id="providersToggle"
             checked>
      Provider locations
    </label>
  `;

  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);

  div.querySelectorAll(
    'input[name="measure"]'
  ).forEach(input => {

    input.addEventListener(
      "change",
      function() {

        currentLayer = this.value;

        if (tractLayer) {
          tractLayer.setStyle(tractStyle);
        }

        updateLegend();
      }
    );
  });

  div.querySelector(
    "#providersToggle"
  ).addEventListener(
    "change",
    function() {

      showProviders = this.checked;

      if (showProviders) {
        providerLayer.addTo(map);
      } else {
        map.removeLayer(providerLayer);
      }
    }
  );

  return div;
};

layerControl.addTo(map);

////////////////////////////////////////////////////////////
// Dynamic legend
////////////////////////////////////////////////////////////

const legend = L.control({
  position: "topright"
});

let legendDiv;

legend.onAdd = function() {

  legendDiv = L.DomUtil.create(
    "div",
    "legend"
  );

  updateLegend();

  return legendDiv;
};

legend.addTo(map);

function updateLegend() {

  if (!legendDiv) return;

  const isSPAR = currentLayer === "SPAR";

  const maxValue =
    isSPAR ? 5 : spaiMax;

  const palette =
    isSPAR ?
      d3.interpolateViridis :
      d3.interpolateMagma;

  const colors = Array.from(
    {length: 101},
    (_, i) => palette(i / 100)
  );

  const gradient =
    `linear-gradient(to right, ${colors.join(",")})`;

  let labels;

  if (isSPAR) {

    labels = [
      "0", "1", "2", "3", "4", "5+"
    ];

  } else {

    labels = [0, 0.5, 1].map(
      x => (x * maxValue * 1e5).toFixed(2)
    );
  }

  legendDiv.innerHTML = `
    <b>
      ${isSPAR ?
        "SPAR (5+ capped)" :
        "SPAI (× 10⁻⁵)"}
    </b>

    <div class="legend-bar"
         style="background:${gradient}">
    </div>

    <div class="legend-labels">
      ${labels.map(
        x => `<span>${x}</span>`
      ).join("")}
    </div>
  `;
}

////////////////////////////////////////////////////////////
// Load national tract TopoJSON
////////////////////////////////////////////////////////////

fetch("data/tracts.topojson")

  .then(response => {

    if (!response.ok) {
      throw new Error(
        "Cannot load tracts.topojson"
      );
    }

    return response.json();
  })

  .then(topology => {

    const objectName =
      Object.keys(topology.objects)[0];

    const geojson = topojson.feature(
      topology,
      topology.objects[objectName]
    );

    ////////////////////////////////////////////////////////
    // Determine SPAI maximum
    ////////////////////////////////////////////////////////

    spaiMax = geojson.features.reduce(
      (max, feature) => {

        const value =
          Number(feature.properties.SPAI);

        return Number.isFinite(value)
          ? Math.max(max, value)
          : max;
      },
      0
    );

    if (spaiMax <= 0) {
      spaiMax = 1;
    }

    ////////////////////////////////////////////////////////
    // Draw tract polygons
    ////////////////////////////////////////////////////////

    tractLayer = L.geoJSON(
      geojson,
      {
        renderer: L.canvas({
          padding: 0.5
        }),

        style: tractStyle,

        onEachFeature: function(feature, layer) {

          layer.bindPopup(
            () => tractPopup(feature)
          );
        }
      }
    ).addTo(map);

    updateLegend();

    document.getElementById(
      "status"
    ).style.display = "none";

    console.log(
      "Tracts loaded:",
      geojson.features.length
    );
  })

  .catch(error => {

    document.getElementById(
      "status"
    ).textContent =
      "Error loading tract data: " +
      error.message;

    console.error(error);
  });

 ////////////////////////////////////////////////////////////
// Add white state boundary outlines
////////////////////////////////////////////////////////////

// Create a separate pane above the tract polygons
map.createPane("stateBoundaries");
map.getPane("stateBoundaries").style.zIndex = 450;
map.getPane("stateBoundaries").style.pointerEvents = "none";

// Load state boundaries
fetch("data/states.geojson")

  .then(response => {

    if (!response.ok) {
      throw new Error(
        "Cannot load states.geojson"
      );
    }

    return response.json();
  })

  .then(statesData => {

    const stateLayer = L.geoJSON(
      statesData,
      {
        pane: "stateBoundaries",

        style: {
          color: "#FFFFFF",
          weight: 1.5,
          opacity: 1,
          fill: false,
          interactive: false
        }
      }
    ).addTo(map);

    console.log(
      "State boundaries loaded:",
      statesData.features.length
    );
  })

  .catch(error => {
    console.error(
      "Error loading state boundaries:",
      error
    );
  });

////////////////////////////////////////////////////////////
// Load actual geocoded provider locations
////////////////////////////////////////////////////////////

fetch("data/providers.geojson")

  .then(response => {

    if (!response.ok) {
      throw new Error(
        "Cannot load providers.geojson"
      );
    }

    return response.json();
  })

  .then(geojson => {

    providerLayer = L.geoJSON(
      geojson,
      {
        pointToLayer: function(feature, latlng) {

          return L.circleMarker(
            latlng,
            {
              renderer: providerRenderer,
              radius: 4,
              color: "#1f77b4",
              fillColor: "#1f77b4",
              weight: 1,
              stroke: true,
              fillOpacity: 0.85,
              interactive: true
            }
          );
        },

        onEachFeature: function(feature, layer) {

          layer.bindPopup(`
            <b>Endometriosis Excision Specialist</b>
          `);
        }
      }
    );

    if (showProviders) {
      providerLayer.addTo(map);
    }

    console.log(
      "Provider locations loaded:",
      geojson.features.length
    );
  })

  .catch(error => {
    console.error(
      "Error loading provider locations:",
      error
    );
  });

</script>
</body>
</html>
